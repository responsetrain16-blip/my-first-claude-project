<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Income Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Expense &amp; Income Tracker</h1>

    <!-- Summary: totals for the selected month (or all time) -->
    <section class="summary">
      <div class="card">
        <span class="label">Balance</span>
        <span class="value" id="balance">$0.00</span>
      </div>
      <div class="card">
        <span class="label">Income</span>
        <span class="value income" id="total-income">$0.00</span>
      </div>
      <div class="card">
        <span class="label">Expenses</span>
        <span class="value expense" id="total-expense">$0.00</span>
      </div>
    </section>

    <!-- Form for adding a new transaction -->
    <section class="panel">
      <h2>Add a transaction</h2>
      <form id="transaction-form">
        <div class="type-toggle">
          <label><input type="radio" name="type" value="expense" checked> Expense</label>
          <label><input type="radio" name="type" value="income"> Income</label>
        </div>

        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Groceries" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>

        <label for="category">Category</label>
        <select id="category"></select>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <button type="submit">Add</button>
      </form>
    </section>

    <!-- List of saved transactions, with filters -->
    <section class="panel">
      <h2>Transactions</h2>
      <div class="filters">
        <label>
          Show
          <select id="filter-type">
            <option value="all">All</option>
            <option value="income">Income only</option>
            <option value="expense">Expenses only</option>
          </select>
        </label>
        <label>
          Month
          <input type="month" id="filter-month">
        </label>
        <button type="button" id="clear-month" class="link-button">All months</button>
      </div>

      <ul id="transaction-list"></ul>
      <p id="empty-message" class="empty">No transactions yet. Add one above!</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
