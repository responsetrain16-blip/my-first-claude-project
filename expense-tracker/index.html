<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A private, easy-to-use tracker for your income, spending, budgets and savings goals.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <!-- Don't send the page address to other websites -->
  <meta name="referrer" content="no-referrer">
  <title>Finance Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <!-- Lets the website be installed on a phone or computer like an app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- The app itself (hidden until it has started, or while locked) -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">💰</span>
        <span>Finance Tracker</span>
      </div>
      <button id="add-btn" class="btn btn-primary add-btn" type="button"></button>
      <nav id="side-nav" class="side-nav" aria-label="Main"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <button id="privacy-btn" class="icon-btn" type="button" aria-pressed="false"></button>
          <button id="lock-btn" class="icon-btn" type="button" aria-label="Lock app" title="Lock app" hidden></button>
          <a id="settings-btn" class="icon-btn mobile-only" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings"></a>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <button id="fab" class="fab" type="button" aria-label="Add transaction"></button>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main"></nav>
  </div>

  <!-- PIN lock screen -->
  <div id="lock-screen" class="lock-screen" hidden></div>

  <!-- Pop-up notifications -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Finance Tracker needs JavaScript turned on to work.</p>
  </noscript>

  <!-- The order matters: each file uses the ones above it -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/security.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/transactions.js"></script>
  <script src="js/views/budgets.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
